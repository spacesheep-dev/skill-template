# A tag v<major>.<minor>.<patch> makes a GitHub release, once the skill passes the check at
# that tag. The release is what Spacesheep takes as a new version. A tag with a suffix
# (v1.1.0-rc1) becomes a pre-release, which Spacesheep ignores.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check the skill at this tag
        run: npx -y spacesheep@latest skills lint

      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            pre=""
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            pre="--prerelease"
          else
            echo "::error::$TAG isn't v<major>.<minor>.<patch>: no release made"
            exit 1
          fi
          # The section under "## [1.2.0] - <date>" in CHANGELOG.md (Keep a Changelog) for tag v1.2.0, up to
          # the next "## " heading, without the link lines at the end and the blank lines before it.
          notes=$(awk -v ver="[${TAG#v}]" '/^## / { on = ($2 == ver); next } /^\[[^]]*\]: / { next } on' CHANGELOG.md | sed '/./,$!d')
          gh release create "$TAG" --verify-tag --title "$TAG" --notes "${notes:-$TAG}" $pre
